<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neko · 身份画廊</title>
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface-2: #efebe4;
    --text: #1b1916;
    --muted: #6f675e;
    --line: #e3ddd3;
    --accent: #d9502b;
    --accent-soft: #fdeae3;
    --accent-ink: #ffffff;
    --ring: rgba(217, 80, 43, 0.22);
    --ok: #2f7d52;
    --shadow: 0 1px 2px rgba(20, 16, 10, 0.04), 0 10px 30px -18px rgba(20, 16, 10, 0.35);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120f;
      --surface: #1d1a16;
      --surface-2: #272320;
      --text: #f2ede6;
      --muted: #a69c90;
      --line: #332d27;
      --accent: #ff7a52;
      --accent-soft: #3a2119;
      --accent-ink: #1a100c;
      --ring: rgba(255, 122, 82, 0.28);
      --ok: #6fd39b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -24px rgba(0, 0, 0, 0.8);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120f;
    --surface: #1d1a16;
    --surface-2: #272320;
    --text: #f2ede6;
    --muted: #a69c90;
    --line: #332d27;
    --accent: #ff7a52;
    --accent-soft: #3a2119;
    --accent-ink: #1a100c;
    --ring: rgba(255, 122, 82, 0.28);
    --ok: #6fd39b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    padding-bottom: 150px;
  }
  button { font: inherit; color: inherit; }

  .top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand b { font-size: 16px; letter-spacing: 0.02em; }
  .brand span { color: var(--muted); font-size: 12px; }
  .search {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: var(--shadow);
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit;
  }
  .search input::placeholder { color: var(--muted); }
  .count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .chips {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 12px 16px 4px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }

  main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 24px; }

  .group { margin-top: 22px; }
  .group-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 2px 10px;
  }
  .group-head h2 { margin: 0; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
  .group-head em { color: var(--muted); font-size: 12px; font-style: normal; }

  .grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  }

  .card {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .card:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 3px var(--ring);
  }

  .avatar {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    background: var(--surface-2); object-fit: cover;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 600; color: var(--muted);
    overflow: hidden;
  }
  .card[aria-pressed="true"] .avatar { box-shadow: 0 0 0 2px var(--accent); }

  .meta { min-width: 0; flex: 1; }
  .name { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .name .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .sub {
    color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge {
    flex: 0 0 auto;
    font-size: 10.5px; line-height: 1; padding: 4px 6px; border-radius: 6px;
    border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--line));
    color: var(--accent);
    background: transparent;
  }

  .empty { color: var(--muted); text-align: center; padding: 60px 0; }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .dock-inner {
    max-width: 1120px; margin: 0 auto; padding: 10px 16px 14px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  }
  .dock-label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .stack { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .divider { width: 1px; height: 22px; background: var(--line); }
  .selection { font-size: 14px; font-weight: 600; }
  .selection.idle { color: var(--muted); font-weight: 400; }

  .mini {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 8px; padding: 5px 10px; font-size: 12.5px;
    color: var(--muted); cursor: pointer;
  }
  .mini[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  .mini:hover { color: var(--text); }
  .mini[aria-pressed="true"]:hover { color: var(--accent-ink); }

  .address {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 4px 10px; background: var(--surface);
  }
  .address[hidden] { display: none; }
  .address label { color: var(--accent); font-size: 12px; white-space: nowrap; }
  .address input {
    border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 13px; width: 120px;
  }

  .spacer { flex: 1 1 auto; }
  .confirm {
    border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 20px; font-size: 14px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: opacity 0.15s, transform 0.12s;
  }
  .confirm:hover:not(:disabled) { transform: translateY(-1px); }
  .confirm:disabled { opacity: 0.4; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 130px; transform: translate(-50%, 12px);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 10px 16px; font-size: 13px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s; max-width: min(90vw, 460px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .done {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(6px);
  }
  .done[hidden] { display: none; }
  .done-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 32px 36px; text-align: center;
    box-shadow: var(--shadow); max-width: min(90vw, 420px);
  }
  .done-card .tick {
    width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%;
    display: grid; place-items: center; color: var(--ok);
    border: 2px solid var(--ok); font-size: 22px;
  }
  .done-card h3 { margin: 0 0 6px; font-size: 18px; }
  .done-card p { margin: 0; color: var(--muted); font-size: 13px; }
  .done-card code {
    display: block; margin-top: 14px; padding: 8px 10px;
    background: var(--surface-2); border-radius: 8px;
    font-size: 11.5px; color: var(--muted); word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (max-width: 560px) {
    .top { flex-wrap: wrap; gap: 10px; }
    .search { order: 3; flex-basis: 100%; }
    .count { margin-left: auto; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .card { flex-direction: column; align-items: flex-start; gap: 8px; }
    .avatar { width: 54px; height: 54px; }
    .sub { white-space: normal; }
    .dock-inner { gap: 8px; }
    .divider { display: none; }
    .spacer { display: none; }
    .confirm { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>neko</b><span>身份画廊</span></div>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
      <path d="m11 11 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="搜索作品 / 中文名 / 英文名（按 / 聚焦）" autocomplete="off" spellcheck="false">
  </label>
  <div class="count" id="count"></div>
</header>

<nav class="chips" id="ips" aria-label="按作品筛选"></nav>

<main id="groups"></main>

<footer class="dock">
  <div class="dock-inner">
    <div class="stack">
      <span class="dock-label">身份</span>
      <span class="selection idle" id="selName">未选择</span>
    </div>
    <div class="divider"></div>
    <div class="stack">
      <span class="dock-label">人格</span>
      <div class="stack" id="pers"></div>
    </div>
    <div class="divider"></div>
    <div class="stack">
      <span class="dock-label">场景</span>
      <div class="stack" id="scens"></div>
    </div>
    <div class="address" id="addrBox" hidden>
      <label for="addr">称呼</label>
      <input id="addr" type="text" placeholder="训练员 / 博士 / 搭档…" autocomplete="off">
    </div>
    <div class="spacer"></div>
    <button class="confirm" id="confirm" disabled>确认切换</button>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="done" id="done" hidden>
  <div class="done-card">
    <div class="tick">✓</div>
    <h3 id="doneTitle">已切换</h3>
    <p>身份区块已写入全局指令，可以关掉这个页面了。</p>
    <code id="doneCmd"></code>
  </div>
</div>

<script>
(() => {
  const TOKEN = '__NEKO_TOKEN__';
  const $ = (id) => document.getElementById(id);

  const state = {
    catalog: null,
    personas: [],
    ip: 'all',
    query: '',
    selected: null,
    personalities: new Set(),
    scenario: null,
  };

  const HUE_STEP = 47;
  function hueOf(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }

  function avatarEl(persona) {
    if (persona.hasImage) {
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = persona.image;
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = () => { img.replaceWith(fallbackAvatar(persona)); };
      return img;
    }
    return fallbackAvatar(persona);
  }

  function fallbackAvatar(persona) {
    const el = document.createElement('div');
    el.className = 'avatar';
    const h = hueOf(persona.name);
    el.style.background = `linear-gradient(140deg, hsl(${h} 45% 88%), hsl(${(h + HUE_STEP) % 360} 45% 76%))`;
    el.style.color = `hsl(${h} 35% 32%)`;
    el.textContent = persona.name.slice(0, 1);
    return el;
  }

  function cardEl(persona) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.dataset.id = persona.id;
    card.setAttribute('aria-pressed', String(state.selected === persona.id));

    card.appendChild(avatarEl(persona));

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = persona.name;
    if (state.selected === persona.id) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      name.appendChild(dot);
    }
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = [persona.en, persona.tagline].filter(Boolean).join(' · ');
    meta.appendChild(name);
    meta.appendChild(sub);
    card.appendChild(meta);

    if (persona.needsAddress) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '称呼待定';
      card.appendChild(badge);
    }

    card.addEventListener('click', () => select(persona));
    return card;
  }

  function matches(persona) {
    if (state.ip !== 'all' && persona.ip !== state.ip) return false;
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    return [persona.name, persona.en, persona.tagline, persona.ip, persona.label || '']
      .some((v) => (v || '').toLowerCase().includes(q));
  }

  function renderIps() {
    const box = $('ips');
    box.textContent = '';
    const items = [{ ip: 'all', label: '全部', count: state.catalog.total }]
      .concat(state.catalog.groups.map((g) => ({ ip: g.ip, label: g.label, count: g.count })));
    for (const item of items) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = item.label + ' ' + item.count;
      chip.setAttribute('aria-pressed', String(state.ip === item.ip));
      chip.addEventListener('click', () => { state.ip = item.ip; renderIps(); renderGroups(); });
      box.appendChild(chip);
    }
  }

  function renderGroups() {
    const main = $('groups');
    main.textContent = '';
    let shown = 0;

    for (const group of state.catalog.groups) {
      if (state.ip !== 'all' && state.ip !== group.ip) continue;
      const list = group.personas.filter(matches);
      if (list.length === 0) continue;
      shown += list.length;

      const section = document.createElement('section');
      section.className = 'group';
      const head = document.createElement('div');
      head.className = 'group-head';
      const h2 = document.createElement('h2');
      h2.textContent = group.label;
      const em = document.createElement('em');
      em.textContent = list.length + ' 位';
      head.appendChild(h2);
      head.appendChild(em);
      section.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const persona of list) grid.appendChild(cardEl(persona));
      section.appendChild(grid);
      main.appendChild(section);
    }

    if (shown === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '没有匹配的身份 —— 换个词试试？';
      main.appendChild(empty);
    }
    $('count').textContent = shown + ' / ' + state.catalog.total;
  }

  function renderLayers() {
    const persBox = $('pers');
    persBox.textContent = '';
    for (const p of state.catalog.personalities) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'mini';
      chip.textContent = p.name;
      chip.title = p.description || '';
      chip.setAttribute('aria-pressed', String(state.personalities.has(p.id)));
      chip.addEventListener('click', () => {
        if (state.personalities.has(p.id)) state.personalities.delete(p.id);
        else state.personalities.add(p.id);
        renderLayers();
      });
      persBox.appendChild(chip);
    }

    const scenBox = $('scens');
    scenBox.textContent = '';
    const none = document.createElement('button');
    none.type = 'button';
    none.className = 'mini';
    none.textContent = '不启用';
    none.setAttribute('aria-pressed', String(state.scenario === null));
    none.addEventListener('click', () => { state.scenario = null; renderLayers(); });
    scenBox.appendChild(none);
    for (const s of state.catalog.scenarios) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'mini';
      chip.textContent = s.name;
      chip.title = s.description || '';
      chip.setAttribute('aria-pressed', String(state.scenario === s.id));
      chip.addEventListener('click', () => {
        state.scenario = state.scenario === s.id ? null : s.id;
        renderLayers();
      });
      scenBox.appendChild(chip);
    }
  }

  function select(persona) {
    state.selected = persona.id;
    for (const card of document.querySelectorAll('.card')) {
      card.setAttribute('aria-pressed', String(card.dataset.id === persona.id));
      const dot = card.querySelector('.dot');
      if (card.dataset.id === persona.id && !dot) {
        const nameEl = card.querySelector('.name');
        const d = document.createElement('span');
        d.className = 'dot';
        nameEl.appendChild(d);
      } else if (card.dataset.id !== persona.id && dot) {
        dot.remove();
      }
    }
    const selName = $('selName');
    selName.textContent = persona.name + ' · ' + (persona.en || persona.ip);
    selName.classList.remove('idle');
    $('addrBox').hidden = !persona.needsAddress;
    $('confirm').disabled = false;
    if (persona.needsAddress) setTimeout(() => $('addr').focus(), 30);
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
  }

  async function submit() {
    if (!state.selected) return;
    const persona = state.personas.find((p) => p.id === state.selected);
    if (!persona) return;
    const address = $('addr').value.trim();
    if (persona.needsAddress && !address) {
      toast('这个人设的称呼待定，先填一下称呼吧');
      $('addr').focus();
      return;
    }
    const btn = $('confirm');
    btn.disabled = true;
    btn.textContent = '切换中…';
    try {
      const res = await fetch('/api/select', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Neko-Token': TOKEN },
        body: JSON.stringify({
          persona: state.selected,
          personalities: [...state.personalities],
          scenario: state.scenario,
          address,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      $('doneTitle').textContent = '已切换为 ' + persona.name;
      $('doneCmd').textContent = data.output || '';
      $('done').hidden = false;
    } catch (err) {
      toast(String(err.message || err));
      btn.disabled = false;
      btn.textContent = '确认切换';
    }
  }

  function fitPadding() {
    const dock = document.querySelector('.dock');
    if (!dock) return;
    document.body.style.paddingBottom = (dock.offsetHeight + 28) + 'px';
  }

  function applyPrefill() {
    const p = state.catalog.prefill || {};
    if (p.persona) {
      const persona = state.personas.find((x) => x.id === p.persona);
      if (persona) select(persona);
    }
    for (const id of p.personalities || []) {
      if (state.catalog.personalities.some((x) => x.id === id)) state.personalities.add(id);
    }
    if (p.scenario && state.catalog.scenarios.some((x) => x.id === p.scenario)) {
      state.scenario = p.scenario;
    }
    renderLayers();
  }

  function boot() {
    fetch('/api/catalog')
      .then((r) => {
        if (!r.ok) throw new Error('清单加载失败: HTTP ' + r.status);
        return r.json();
      })
      .then((catalog) => {
        state.catalog = catalog;
        for (const g of catalog.groups) {
          for (const p of g.personas) { p.label = g.label; state.personas.push(p); }
        }
        $('addrBox').hidden = true;
        renderIps();
        renderGroups();
        renderLayers();
        applyPrefill();
        fitPadding();
      })
      .catch((err) => {
        $('groups').innerHTML = '<p class="empty"></p>';
        $('groups').firstChild.textContent = err.message;
      });
  }

  $('q').addEventListener('input', (e) => { state.query = e.target.value.trim(); renderGroups(); });
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(fitPadding).observe(document.querySelector('.dock'));
  }
  window.addEventListener('resize', fitPadding);
  $('confirm').addEventListener('click', submit);
  $('done').addEventListener('click', () => { $('done').hidden = true; });

  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) {
      e.preventDefault();
      $('q').focus();
    } else if (e.key === 'Escape') {
      if (typing) {
        $('q').value = '';
        state.query = '';
        renderGroups();
        document.activeElement.blur();
      }
    } else if (e.key === 'Enter' && !typing) {
      if (state.selected && $('done').hidden) submit();
    }
  });

  boot();
})();
</script>
</body>
</html>
